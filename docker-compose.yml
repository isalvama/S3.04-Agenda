services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - agenda-network
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER --password=$$MYSQL_PASSWORD" ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  adminer:
    image: adminer:4
    container_name: adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - agenda-network
    depends_on:
      mysql-db:
        condition: service_healthy
  java-app:
    build:
      context: .                            # Root directory where the Dockerfile is located
      dockerfile: Dockerfile
    container_name: java-app
    restart: "no"
    stdin_open: true
    tty: true                               # Assign a pseudo-terminal for the CLI
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    networks:
      - agenda-network
    depends_on:
      mysql-db:
        condition: service_healthy
volumes:
  mysql-data:
    driver: local

networks:
  agenda-network:
    driver: bridge

